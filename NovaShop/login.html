<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | NovaShop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nova: '#071A42',
            electric: '#2563EB',
            'nova-dark': '#040f28',
            'electric-hover': '#1d4ed8'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- Header Simplificado -->
  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200/80 py-4">
    <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
      <a href="index.html" class="text-2xl font-black text-nova tracking-tight flex items-center gap-2">
        <span class="bg-electric text-white w-8 h-8 rounded-lg flex items-center justify-center text-lg font-bold shadow-md">N</span>
        Nova<span class="text-electric">Shop</span>
      </a>
      <a href="index.html" class="text-xs sm:text-sm font-bold text-slate-600 hover:text-electric transition-colors flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-left text-xs"></i> Volver a la tienda
      </a>
    </div>
  </header>

  <!-- Formulario de Login Principal -->
  <main class="flex-grow flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      
      <!-- Card del Formulario -->
      <div class="bg-white p-8 sm:p-10 rounded-3xl shadow-xl shadow-nova/5 border border-slate-100 relative overflow-hidden">
        <!-- Detalle decorativo superior -->
        <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-nova via-electric to-blue-400"></div>

        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-50 text-electric mb-4 text-2xl font-bold shadow-sm">
            <i class="fa-solid fa-user"></i>
          </div>
          <h1 class="text-3xl font-black text-nova tracking-tight">Bienvenido de nuevo</h1>
          <p class="text-slate-500 text-sm mt-1">Ingresa a tu cuenta para continuar con tus compras.</p>
        </div>

        <!-- Botones de Acceso Rápido / Redes -->
        <div class="grid grid-cols-2 gap-3 mb-6">
          <button type="button" onclick="loginSocial('Google')" class="flex items-center justify-center gap-2 border border-slate-200 hover:border-slate-300 hover:bg-slate-50 py-2.5 px-4 rounded-xl text-xs font-bold text-slate-700 transition-all">
            <i class="fa-brands fa-google text-red-500 text-sm"></i> Google
          </button>
          <button type="button" onclick="loginSocial('Facebook')" class="flex items-center justify-center gap-2 border border-slate-200 hover:border-slate-300 hover:bg-slate-50 py-2.5 px-4 rounded-xl text-xs font-bold text-slate-700 transition-all">
            <i class="fa-brands fa-facebook text-blue-600 text-sm"></i> Facebook
          </button>
        </div>

        <div class="flex items-center gap-3 my-6">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="text-xs font-bold text-slate-400 uppercase">o con correo</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <!-- Formulario -->
        <form onsubmit="handleLogin(event)" class="space-y-5">
          <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Correo electrónico</label>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                <i class="fa-regular fa-envelope text-sm"></i>
              </span>
              <input required type="email" id="emailInput" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl pl-10 pr-4 py-3 text-sm focus:outline-none focus:border-electric focus:bg-white transition-all font-medium placeholder:text-slate-400" placeholder="correo@ejemplo.com">
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">Contraseña</label>
              <a href="recuperar.html" class="text-xs text-electric hover:underline font-bold">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="relative">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                <i class="fa-solid fa-lock text-sm"></i>
              </span>
              <input required type="password" id="passwordInput" class="w-full bg-slate-50 border border-slate-200 text-slate-900 rounded-xl pl-10 pr-10 py-3 text-sm focus:outline-none focus:border-electric focus:bg-white transition-all font-medium placeholder:text-slate-400" placeholder="Tu contraseña">
              <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600">
                <i id="togglePassIcon" class="fa-regular fa-eye text-sm"></i>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs pt-1">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-electric focus:ring-electric">
              <span class="font-bold text-slate-600">Recordarme en este dispositivo</span>
            </label>
          </div>

          <button type="submit" class="w-full bg-nova hover:bg-nova-dark text-white font-bold py-3.5 rounded-xl shadow-lg shadow-nova/10 hover:shadow-nova/20 transition-all flex items-center justify-center gap-2 text-sm">
            <span>Iniciar sesión</span>
            <i class="fa-solid fa-right-to-bracket text-xs"></i>
          </button>
        </form>

        <p class="text-center mt-8 text-xs text-slate-500 font-medium">
          ¿Aún no tienes cuenta?
          <a href="registro.html" class="text-electric font-bold hover:underline">Regístrate aquí</a>
        </p>
      </div>

    </div>
  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-nova text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 flex items-center gap-3 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div id="toastIcon" class="w-8 h-8 rounded-full bg-electric/20 text-electric flex items-center justify-center">
      <i class="fa-solid fa-info"></i>
    </div>
    <span id="toastMsg" class="font-bold text-sm">Mensaje de notificación</span>
  </div>

  <!-- Footer Simplificado -->
  <footer class="py-6 border-t border-slate-200 text-center text-xs text-slate-500">
    <p>© 2026 NovaShop. Todos los derechos reservados.</p>
  </footer>

  <script>
    // Mostrar u ocultar contraseña
    function togglePasswordVisibility() {
      const passInput = document.getElementById('passwordInput');
      const icon = document.getElementById('togglePassIcon');

      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Manejar submit del formulario
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      
      showToast(`Iniciando sesión como ${email}...`);
      
      // Simular redirección
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    }

    // Botones sociales de prueba
    function loginSocial(provider) {
      showToast(`Iniciando sesión con ${provider}...`);
    }

    // Mostrar Toast
    function showToast(mensaje) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      
      toastMsg.textContent = mensaje;
      toast.classList.remove('translate-y-20', 'opacity-0');

      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }
  </script>

</body>
</html>
